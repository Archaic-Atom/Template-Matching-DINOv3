name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.sha }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements-cpu.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tests/requirements-cpu.txt
      - name: Compile first-party Python
        run: python -m compileall -q Source/UserModelImplementation Source/Tools Scripts/autodl Source/main.py
      - name: Check shell syntax
        run: find Scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n
      - name: Check numerical and configuration contracts
        run: python -m unittest discover -s tests -v
      - name: Check queue isolation without training
        run: python Scripts/autodl/test_review_overlap_20261027.py
