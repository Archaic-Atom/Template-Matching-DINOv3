# TM_Model_D — ablation: soft argmax + sub-pixel refinement.
#
# Architecture identical to TM_Model_A. Difference: at evaluation time the
# fine heatmap's peak is refined via 2D quadratic fit over the 3x3
# neighborhood around the argmax, giving sub-pixel offsets in [-0.5, 0.5].
# Training loss is unchanged (BCE on Gaussian-targeted heatmap).
#
# Used to demonstrate that hard argmax over a stride-1 fine heatmap is the
# binding constraint on sub-pixel precision, and that a trivial post-process
# recovers it without retraining.

name: TM_Model_D
description: Ablation — soft argmax + sub-pixel quadratic fit on the fine heatmap.

architecture:
  rgb_encoder:
    type: DinoV3Backbone
    freeze: true
    args:
      name: dinov3_vitl16
      repo_path: "${root_path}/Source/Libs/dinov3/"
      weights_path: "${root_path}/Weights/dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth"

  sar_encoder:
    type: SarResNet16GN
    args:
      in_chans: 3
      dino_dim: 1024
      layers: [3, 4, 6]
      channels: [64, 128, 256]

  matching:
    type: StandardMatchingHead
    args:
      dino_dim: 1024
      matching_dim: 128
      fine_dim: 32
      fine_margin: 4
      sar_size: 64

training:
  stage_1:
    load_pretrained_sar: true
    loss:
      type: alignment_loss
      tau: 0.07
      radius: 1
      lambda_global: 0.1
    optimizer:
      type: sgd
      momentum: 0.9
      weight_decay: 0.0001
      lr_factor: 0.8
      lr_patience: 5

  stage_2:
    freeze_sar_encoder: true
    loss:
      type: two_stage_matching_loss
      match_w4: 1.0
      match_w8: 0.5
      match_sigma4: 1.0
      match_sigma8: 1.0
      match_sigma_fine: 1.0
      match_w_fine: 1.0
      fine_warmup_epochs: 3
    optimizer:
      type: adamw
      betas: [0.9, 0.999]
      weight_decay: 0.01
      lr_factor: 0.8
      lr_patience: 5

inference:
  argmax_type: soft_subpixel    # ← THE ABLATION (D's only diff vs A)
  primary_stride: 4
